[package]
name = "appointment-agent"
version = "0.1.4"
edition = "2021"

[dependencies]
# Core Runtime
tokio = { version = "1.43", features = ["full", "tracing", "signal"] }

# Networking & Stealth
# Using rc.25 to avoid typed-builder macro bugs in rc.26
wreq = "6.0.0-rc.25"
wreq-util = "3.0.0-rc.1"

# Web Scraping
scraper = "0.22"

# Web Dashboard & API
axum = "0.8"
tokio-tungstenite = "0.26"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
rust-embed = "8.5"

# Data & Serialization
serde = { version = "1.0", features = ["derive"] }
serde_yml = "0.0.12"
serde_json = "1.0"
dashmap = "6.1"
uuid = { version = "1.13", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Transitive Dependency Pins (Fixes Rust 1.86+ MSRV conflicts)
# Research shows version 2.1 is the last icu4x series compatible with standard MSRV
icu_collections = "=2.1.0"
icu_locid = "=1.5.0"
icu_properties = "=1.5.1"
icu_normalizer = "=1.5.0"

# Utilities
anyhow = "1.0"
thiserror = "2.0"
rand = "0.8"
url = "2.5"
clap = { version = "4.5", features = ["derive"] }
humantime = "2.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
wiremock = "0.6"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
