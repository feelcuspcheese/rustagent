[package]
name = "appointment-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
# Core Async Runtime
tokio = { version = "1.37", features = ["full", "tracing", "signal"] }

# Networking & Stealth (wreq handles its own boring-sys internal dependencies)
wreq = "6.0.0-rc.26"
wreq-util = "3.0.0-rc.1"

# Web Scraping
scraper = "0.19.0"

# Web Dashboard & API
axum = "0.7.5"
tokio-tungstenite = "0.23.1"
tower = "0.4.13"
tower-http = { version = "0.5.2", features = ["cors", "trace", "fs"] }
rust-embed = "8.4"

# Serialization & Data
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
dashmap = "6.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Utilities
anyhow = "1.0"
thiserror = "1.0"
rand = "0.8"
url = "2.5"
clap = { version = "4.5", features = ["derive"] }
humantime = "2.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
wiremock = "0.6"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
