[package]
name = "appointment-agent"
version = "0.1.1"
edition = "2024"

[dependencies]
# Core Runtime
tokio = { version = "1.43", features = ["full", "tracing", "signal"] }

# Networking & Stealth
# wreq handles its own internal BoringSSL/TLS fingerprinting dependencies.
# Do NOT add boring-sys manually; it causes a "links = 'boringssl'" conflict.
wreq = "6.0.0-rc.26"
wreq-util = "3.0.0-rc.1"

# Web Scraping
scraper = "0.22"

# Web Dashboard & API
# axum 0.8 is the current stable release as of early 2025
axum = "0.8"
tokio-tungstenite = "0.26"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
rust-embed = "8.5"

# Data & Serialization
serde = { version = "1.0", features = ["derive"] }
# serde_yml 0.0.12 is the current stable version for this fork
serde_yml = "0.0.12"
serde_json = "1.0"
dashmap = "6.1"
uuid = { version = "1.13", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Utilities
anyhow = "1.0"
thiserror = "2.0"
url = "2.5"
rand = "0.8"
clap = { version = "4.5", features = ["derive"] }
humantime = "2.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
wiremock = "0.6"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
